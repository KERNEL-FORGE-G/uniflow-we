<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="uf-flow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="uf-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A8" />
    </linearGradient>
    <filter id="uf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0D9488" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Continuous Flow Ribbon / Infinity U -->
  <path d="M28 32 C28 18, 48 18, 52 34 L56 50 C60 66, 76 66, 76 52 C76 38, 62 38, 56 46" 
        stroke="url(#uf-flow)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  
  <path d="M72 68 C72 82, 52 82, 48 66 L44 50 C40 34, 24 34, 24 48 C24 62, 38 62, 44 54" 
        stroke="url(#uf-accent)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#uf-glow)" />

  <!-- Core Flow Spark -->
  <circle cx="50" cy="50" r="3.5" fill="#FFFFFF" />
</svg>