name: UniFlow Monorepo CI/CD (Web · Mobile · Desktop)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  web-build:
    name: Web (React + TypeScript + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build production bundle
        env:
          VITE_APPWRITE_ENDPOINT: https://vps.kernelforge.codes/v1
          VITE_APPWRITE_PROJECT_ID: uniflow
          VITE_APPWRITE_DATABASE_ID: uniflow
        run: pnpm run build

      - name: Upload Web dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: uniflow-web-dist
          path: web/dist
          if-no-files-found: warn

  mobile-build:
    name: Mobile (Flutter Android APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup environment file
        run: cp .env.example .env 2>/dev/null || touch .env

      - name: Install Flutter packages
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Android APK (Release)
        run: flutter build apk --release

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: uniflow-mobile-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn

  desktop-linux:
    name: Desktop Linux (Flutter Release & DEB)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libsecret-1-dev \
            libjsoncpp-dev \
            dpkg-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup environment file
        run: cp .env.example .env 2>/dev/null || touch .env

      - name: Install Flutter packages
        run: flutter pub get

      - name: Analyze & Test Desktop
        run: |
          flutter analyze
          flutter test

      - name: Build Flutter Linux Desktop (Release)
        run: flutter build linux --release

      - name: Build Debian Package (.deb)
        run: |
          chmod +x linux/packaging/deb/build_deb.sh
          ./linux/packaging/deb/build_deb.sh

      - name: Upload Linux Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uniflow-desktop-linux-packages
          path: |
            desktop/build/linux/dist/*.deb
            desktop/build/linux/x64/release/bundle/
          if-no-files-found: warn

  desktop-windows:
    name: Desktop Windows (Flutter Release Bundle)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup environment file
        run: copy .env.example .env 2>nul || type nul > .env

      - name: Install Flutter packages
        run: flutter pub get

      - name: Build Flutter Windows Desktop (Release)
        run: flutter build windows --release

      - name: Upload Windows Desktop Bundle
        uses: actions/upload-artifact@v4
        with:
          name: uniflow-desktop-windows-bundle
          path: desktop/build/windows/x64/runner/Release/
          if-no-files-found: warn
