name: UniFlow Monorepo CI/CD (Web · Mobile · Desktop)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  web-build:
    name: Web (React + TypeScript + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build production bundle
        env:
          VITE_APPWRITE_ENDPOINT: https://vps.kernelforge.codes/v1
          VITE_APPWRITE_PROJECT_ID: uniflow
          VITE_APPWRITE_DATABASE_ID: uniflow
        run: pnpm run build

      - name: Upload Web dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: uniflow-web-dist
          path: web/dist
          if-no-files-found: warn

  mobile-build:
    name: Mobile (Flutter Android APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup environment file
        run: cp .env.example .env 2>/dev/null || touch .env

      - name: Install Flutter packages
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Android APK (Release)
        run: flutter build apk --release

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: uniflow-mobile-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn

  desktop-linux:
    name: Desktop Linux (DEB · AppImage · RPM)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            file \
            build-essential \
            curl \
            wget \
            libssl-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'desktop/src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Tauri Linux packages (.deb, .AppImage, .rpm)
        env:
          VITE_APPWRITE_ENDPOINT: https://vps.kernelforge.codes/v1
          VITE_APPWRITE_PROJECT_ID: uniflow
          VITE_APPWRITE_DATABASE_ID: uniflow
        run: pnpm tauri build --bundles deb,appimage,rpm

      - name: Upload Linux Desktop Installers (.deb, .AppImage, .rpm)
        uses: actions/upload-artifact@v4
        with:
          name: uniflow-desktop-linux-packages
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: warn

  desktop-windows:
    name: Desktop Windows (MSI · EXE · Microsoft Store 9NGZKFGK98K6)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'desktop/src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Tauri Windows packages (.msi & .exe)
        env:
          VITE_APPWRITE_ENDPOINT: https://vps.kernelforge.codes/v1
          VITE_APPWRITE_PROJECT_ID: uniflow
          VITE_APPWRITE_DATABASE_ID: uniflow
        run: pnpm tauri build --bundles msi,nsis

      - name: Upload Windows MSI & Store Identity Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uniflow-desktop-windows-msi
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/windows/AppxManifest.xml
          if-no-files-found: warn
