name: UniFlow Desktop Multi-Platform Release (Windows EXE/MSI/MSIX & Linux DEB/RPM/AppImage)

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/*desktop*'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/*desktop*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Numéro de version de la release'
        required: false
        default: '1.0.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. BUILD LINUX DESKTOP (DEB, RPM, APPIMAGE, TARBALL)
  # ============================================================================
  linux-desktop:
    name: Linux Packages (DEB · RPM · AppImage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies & packagers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libsecret-1-dev \
            libjsoncpp-dev \
            dpkg-dev \
            rpm \
            file \
            zsync

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup environment file
        run: cp .env.example .env 2>/dev/null || touch .env

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Verify code quality & tests
        run: |
          flutter analyze
          flutter test

      - name: Build Flutter Linux Release
        run: flutter build linux --release

      - name: Build Debian Package (.deb)
        run: |
          chmod +x linux/packaging/deb/build_deb.sh
          ./linux/packaging/deb/build_deb.sh

      - name: Build RedHat / Fedora Package (.rpm)
        run: |
          chmod +x linux/packaging/rpm/build_rpm.sh
          ./linux/packaging/rpm/build_rpm.sh

      - name: Build Universal Portable AppImage (.AppImage)
        run: |
          chmod +x linux/packaging/appimage/build_appimage.sh
          ./linux/packaging/appimage/build_appimage.sh

      - name: Build Tarball archive (.tar.gz)
        run: |
          mkdir -p build/linux/dist
          tar -czf build/linux/dist/uniflow-linux-x64-bundle-1.0.0.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Debian Package (.deb)
        uses: actions/upload-artifact@v4
        with:
          name: UniFlow-Linux-x64-deb
          path: desktop/build/linux/dist/*.deb
          retention-days: 7
          if-no-files-found: error

      - name: Upload RPM Package (.rpm)
        uses: actions/upload-artifact@v4
        with:
          name: UniFlow-Linux-x64-rpm
          path: desktop/build/linux/dist/*.rpm
          retention-days: 7
          if-no-files-found: warn

      - name: Upload AppImage Package (.AppImage)
        uses: actions/upload-artifact@v4
        with:
          name: UniFlow-Linux-x64-AppImage
          path: desktop/build/linux/dist/*.AppImage
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Linux Tarball (.tar.gz)
        uses: actions/upload-artifact@v4
        with:
          name: UniFlow-Linux-x64-tarball
          path: desktop/build/linux/dist/*.tar.gz
          retention-days: 7
          if-no-files-found: warn

  # ============================================================================
  # 2. BUILD WINDOWS DESKTOP (EXE, MSI, MSIX MICROSOFT STORE)
  # ============================================================================
  windows-desktop:
    name: Windows Packages (EXE · MSI · MSIX Store)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Inno Setup (pour génération EXE)
        run: choco install innosetup -y --no-progress

      - name: Install WiX Toolset (pour génération MSI)
        run: choco install wixtoolset -y --no-progress

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup environment file
        shell: pwsh
        run: if (Test-Path .env.example) { Copy-Item .env.example .env -Force } else { New-Item -ItemType File -Path .env -Force }

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Flutter Windows Release
        run: flutter build windows --release

      - name: Build Standalone Windows Installer (.EXE via Inno Setup)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "build\windows\dist" -Force | Out-Null
          New-Item -ItemType Directory -Path "build\windows\installer" -Force | Out-Null
          
          # Détection dynamique du compilateur Inno Setup
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue)?.Source
          if (-not $iscc) {
            $candidates = @(
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe"
            )
            foreach ($c in $candidates) {
              if (Test-Path $c) { $iscc = $c; break }
            }
          }
          
          if ($iscc) {
            Write-Host "Utilisation de Inno Setup : $iscc" -ForegroundColor Green
            & $iscc "windows\installer\uniflow_installer.iss"
            if (Test-Path "build\windows\installer\UniFlow-1.0.0-Setup.exe") {
              Copy-Item "build\windows\installer\UniFlow-1.0.0-Setup.exe" -Destination "build\windows\dist\" -Force
            }
          } else {
            Write-Warning "Inno Setup introuvable. Exécution du fallback bundle portable."
          }

      - name: Build Windows Installer Package (.MSI via WiX Toolset)
        shell: powershell
        run: |
          # Détection dynamique des binaires WiX Toolset
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            $wixCandidates = @(
              "C:\Program Files (x86)\WiX Toolset v3.11\bin",
              "C:\Program Files\WiX Toolset v3.11\bin",
              "$env:WIX\bin"
            )
            foreach ($w in $wixCandidates) {
              if (Test-Path "$w\candle.exe") {
                $env:PATH = "$w;$env:PATH"
                break
              }
            }
          }
          
          if (Get-Command candle.exe -ErrorAction SilentlyContinue) {
            candle.exe -out "build\windows\dist\uniflow.wixobj" "windows\installer\uniflow_installer.wxs"
            light.exe -out "build\windows\dist\UniFlow-1.0.0.msi" "build\windows\dist\uniflow.wixobj" -ext WixUIExtension
          } else {
            Write-Warning "WiX candle.exe introuvable dans le PATH."
          }

      - name: Build Microsoft Store Package (.MSIX via msix tool)
        shell: powershell
        run: |
          flutter pub run msix:create --output-path "build\windows\dist" --output-name "UniFlow-1.0.0"

      - name: Upload Windows Standalone Setup (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: UniFlow-Windows-x64-EXE-Setup
          path: desktop/build/windows/dist/*.exe
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Windows Installer (.msi)
        uses: actions/upload-artifact@v4
        with:
          name: UniFlow-Windows-x64-MSI
          path: desktop/build/windows/dist/*.msi
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Microsoft Store Package (.MSIX)
        uses: actions/upload-artifact@v4
        with:
          name: UniFlow-Windows-MicrosoftStore-MSIX
          path: desktop/build/windows/dist/*.msix
          retention-days: 7
          if-no-files-found: warn
