services:
  zlibrary:
    build: .
    container_name: uniflow-zlibrary
    restart: unless-stopped
    ports:
      - "7070:7070"
    environment:
      - PORT=7070
      - APPWRITE_ENDPOINT=https://vps.kernelforge.codes/v1
      - APPWRITE_PROJECT_ID=uniflow
      - APPWRITE_DATABASE_ID=uniflow
      - APPWRITE_BUCKET_ID=uniflow_assets
      - APPWRITE_API_KEY=standard_a5f9daa2801fe7e723c6e06866ab6dcee8fe6ee7fdd5193be6be096e8691cc0a58e176d88083e02e0407db8bfcfcf719dfcecb2bd160fefeaa5868de38b77eacc85ed26a7c969ebbf7fd8a9c2b9ba68cf366f610ce12c1b15f310541a22b4777ee7d635907395f1beee3f641af5e7fef6d92e98d573afe19ac09a4d2a7bab6a2
    volumes:
      - ./server.js:/app/server.js
    networks:
      - appwrite
      - default

networks:
  appwrite:
    external: true
  default:
