name: uniflow_desktop
description: "UniFlow Desktop - Suite Académique et Campus Connecté (Flutter Native Linux/Windows/macOS)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  intl: ^0.19.0
  http: ^1.2.2
  url_launcher: ^6.3.2
  qr_flutter: ^4.1.0
  flutter_dotenv: ^6.0.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/mascot/
    - assets/mascots/
    - assets/assistant/
    - assets/logos/
    - assets/onboarding/
